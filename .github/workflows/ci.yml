# Compiles the game on macOS and Linux on every push and pull request. The runner has no
# MageBros.exe (it must never be uploaded), so only the tests that need no game files run here;
# the map and hero tests need the original and run locally. SDL3 is built from the pinned
# source, which is the same path both packages use.
#
# The Linux job runs tools/linux/build.sh, so CI uses the exact Debian 13 container that makes
# the release tarball. Locally: `actionlint` checks this file; `act -j macos -P
# macos-latest=<image with cmake>` runs the macOS steps in a Linux container.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DMBN_SDL_FROM_SOURCE=ON

      - name: Build
        run: cmake --build build

      - name: Test (no game files)
        run: ctest --test-dir build --output-on-failure

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build, test and package in the Debian 13 container
        run: tools/linux/build.sh

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install the pinned SDK, NDK and CMake
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-36" "build-tools;36.1.0" \
                     "ndk;28.2.13676358" "cmake;3.31.6" "platform-tools"

      - name: Build the debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Check the APK's contents
        run: sh android/check-apk.sh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Check 16 KB page alignment
        run: '"$ANDROID_HOME/build-tools/36.1.0/zipalign" -c -P 16 -v 4 android/app/build/outputs/apk/debug/app-debug.apk'

      - uses: actions/upload-artifact@v4
        with:
          name: MageBrosNative-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
