# Builds the Windows zip and, after it, the Linux tarball on every push to main and publishes
# them as a GitHub release named after the version in CMakeLists.txt
# (project(MageBrosNative VERSION x.y.z)). A push that doesn't change the version (docs only, for
# example) finds the release already there and stops.
#
# The runners have no MageBros.exe (it must never be uploaded), so only the tests that need no
# game files run here; the map and hero tests run locally through make_release.bat. Neither
# package contains game content: players still point it at their own MageBros.exe.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write  # to create the tag and the release

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      exists: ${{ steps.version.outputs.exists }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Read the version
        id: version
        shell: pwsh
        run: |
          $text = Get-Content -Raw CMakeLists.txt
          if ($text -notmatch 'project\(MageBrosNative VERSION (\d+\.\d+\.\d+)') { throw 'No version in CMakeLists.txt' }
          $ver = $Matches[1]
          "version=$ver" >> $env:GITHUB_OUTPUT
          gh release view "v$ver" *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release v$ver already exists: nothing to do."
            "exists=true" >> $env:GITHUB_OUTPUT
          } else {
            "exists=false" >> $env:GITHUB_OUTPUT
          }
          exit 0

      - name: Configure
        if: steps.version.outputs.exists == 'false'
        run: cmake -S . -B build -A x64

      - name: Build
        if: steps.version.outputs.exists == 'false'
        run: cmake --build build --config Release

      - name: Test (no game files)
        if: steps.version.outputs.exists == 'false'
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        if: steps.version.outputs.exists == 'false'
        working-directory: build
        run: cpack -C Release

      - name: Publish the release
        if: steps.version.outputs.exists == 'false'
        shell: pwsh
        run: |
          $ver = '${{ steps.version.outputs.version }}'
          $zip = "build/MageBrosNative-$ver-windows-x64.zip"
          if (-not (Test-Path $zip)) { throw "$zip was not made" }
          # This version's section of CHANGELOG.md ("## [x.y.z] - date" up to the next "## "),
          # or the commit message if the changelog has none
          $lines = Get-Content CHANGELOG.md -Encoding utf8
          $start = [Array]::FindIndex($lines, [Predicate[string]]{ param($l) $l.StartsWith("## [$ver]") })
          if ($start -ge 0) {
            $section = $lines[($start + 1)..($lines.Count - 1)]
            $end = [Array]::FindIndex($section, [Predicate[string]]{ param($l) $l.StartsWith('## ') })
            if ($end -ge 0) { $section = if ($end -gt 0) { $section[0..($end - 1)] } else { @() } }
            $changes = ($section -join "`n").Trim()
          } else {
            $changes = (git log -1 --format=%B).Trim()
          }
          $changelog = "https://github.com/$env:GITHUB_REPOSITORY/blob/v$ver/CHANGELOG.md"
          $notes = @(
            $changes,
            '',
            "Full history of changes: [CHANGELOG.md]($changelog)",
            '',
            'Unzip anywhere and put MageBrosNative.exe next to your own copy of MageBros.exe (the',
            'freeware 2.0 build), or run it with --game PATH. The zip contains no game content.'
          ) -join "`n"
          Set-Content -Path notes.md -Value $notes -Encoding utf8
          gh release create "v$ver" $zip --title "Mage Bros. Native $ver" --notes-file notes.md --target $env:GITHUB_SHA

  linux:
    needs: release
    if: needs.release.outputs.exists == 'false'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Build, test and package the Linux tarball
        run: tools/linux/build.sh

      - name: Attach the Linux tarball
        run: |
          ver='${{ needs.release.outputs.version }}'
          file="build-linux/MageBrosNative-$ver-linux-x86_64.tar.gz"
          test -f "$file"
          gh release upload "v$ver" "$file" --clobber

# The Android APK is published only when the repository variable MBN_ANDROID_RELEASE is "true"
# and the signing secrets are set (MBN_ANDROID_KEYSTORE_BASE64, MBN_ANDROID_STORE_PASSWORD,
# MBN_ANDROID_KEY_ALIAS, MBN_ANDROID_KEY_PASSWORD). Without them the desktop releases are
# unaffected.
  android:
    needs: release
    if: needs.release.outputs.exists == 'false' && vars.MBN_ANDROID_RELEASE == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install the pinned SDK, NDK and CMake
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-36" "build-tools;36.1.0" \
                     "ndk;28.2.13676358" "cmake;3.31.6" "platform-tools"

      - name: Decode the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MBN_ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build the signed release APK
        working-directory: android
        env:
          MBN_ANDROID_KEYSTORE: ${{ runner.temp }}/release.jks
          MBN_ANDROID_STORE_PASSWORD: ${{ secrets.MBN_ANDROID_STORE_PASSWORD }}
          MBN_ANDROID_KEY_ALIAS: ${{ secrets.MBN_ANDROID_KEY_ALIAS }}
          MBN_ANDROID_KEY_PASSWORD: ${{ secrets.MBN_ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --console=plain

      - name: Verify and attach the APK
        run: |
          ver='${{ needs.release.outputs.version }}'
          apk=android/app/build/outputs/apk/release/app-release.apk
          sh android/check-apk.sh "$apk"
          "$ANDROID_HOME/build-tools/36.1.0/zipalign" -c -P 16 -v 4 "$apk"
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify "$apk"
          gh release upload "v$ver" "$apk#MageBrosNative-$ver-android-arm64.apk" --clobber
